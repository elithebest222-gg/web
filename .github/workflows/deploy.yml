name: Faster Deploy Build

on:
  push:
    branches: [ main ] # Triggers the build whenever you push code to the main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull down your code using a fast shallow clone
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. Set up Node.js and turn on automated caching
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # This looks for your package-lock.json to lock and cache node_modules

      # 3. Clean install dependencies (this step will pull from cache on subsequent runs)
      - name: Install Dependencies
        run: npm ci

      # 4. Run your build script
      - name: Build Project
        run: npm run build
