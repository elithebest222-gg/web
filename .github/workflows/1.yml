name: Copy Geometry Dash Web Port
on:
  workflow_dispatch:

jobs:
  copy-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Explicitly ensures push access permission
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone Geometry Dash repo
        run: |
          # Clones the root files cleanly since this web port is at the top level
          git clone --depth 1 https://github.com/elithebest222-gg/geometry-dash temp-repo

      - name: Move Assets to Target Location
        run: |
          # Setup destination root structure inside your repository
          mkdir -p games/geometry-dash
          
          # Clean out Git metadata from the temporary folder before copying
          rm -rf temp-repo/.git
          
          # Copy over the specific game directory contents natively
          if [ -f "temp-repo/index.html" ]; then
            rsync -av temp-repo/ games/geometry-dash/
          else
            echo "::error::Source game files not found in temp-repo!"
            exit 1
          fi

      - name: Clean Up Temporary Workspace
        run: |
          rm -rf temp-repo

      - name: Commit and push changes safely to main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage and commit the new game assets
          git add games/geometry-dash/
          git commit -m "Imported Geometry Dash web assets directly via automated workflow" || echo "No changes to commit"
          
          git pull --rebase origin main
          git push origin main
