name: Copy Thats Not My Neighbor Port
on:
  workflow_dispatch:

jobs:
  copy-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Explicitly ensures push access permission
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone Thats Not My Neighbor subdirectory
        run: |
          # Performs a sparse clone to grab only the required game folder
          git clone --depth 1 --sparse --filter=blob:none https://github.com/genizy/web-port temp-repo
          cd temp-repo
          git sparse-checkout set thats-not-my-neighbor

      - name: Move Assets to Target Location
        run: |
          # Setup destination root structure
          mkdir -p games/thats-not-my-neighbor
          
          # Copy over the specific game directory contents
          if [ -d "temp-repo/thats-not-my-neighbor" ]; then
            rsync -av temp-repo/thats-not-my-neighbor/ games/thats-not-my-neighbor/
          else
            echo "::error::Source folder thats-not-my-neighbor not found!"
            exit 1
          fi

      - name: Remove Base Line in Index (Case Insensitive)
        run: |
          INDEX_FILES=$(find games/thats-not-my-neighbor -iname "index.html")
          
          if [ -n "$INDEX_FILES" ]; then
            for file in $INDEX_FILES; do
              echo "Processing base href removal for: $file"
              sed -i '/<base href=/Id' "$file"
            done
            echo "Successfully completed base href sanitization."
          else
            echo "::error::No index.html file found anywhere in games/thats-not-my-neighbor!"
            exit 1
          fi

      - name: Clean Up Temporary Workspace
        run: |
          rm -rf temp-repo

      - name: Commit and push changes safely to main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage and commit the new game assets
          git add games/thats-not-my-neighbor/
          git commit -m "Imported Thats Not My Neighbor web assets directly via standard web sync" || echo "No changes to commit"
          
          git pull --rebase origin main
          git push origin main
