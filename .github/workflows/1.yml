name: Copy Eaglercraft 1.12.2 Web Port
on:
  workflow_dispatch:

jobs:
  copy-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Explicitly ensures push access permission
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone Eaglercraft Web subdirectory
        run: |
          # Performs a sparse clone to grab only the Web folder from the Eaglercraft repo
          git clone --depth 1 --filter=blob:none --sparse https://github.com temp-repo
          cd temp-repo
          # Explicitly target and extract the 'Web' subdirectory structure
          git sparse-checkout set Web

      - name: Move Assets to Target Location
        run: |
          # Setup destination root structure inside your repository
          mkdir -p games/eaglercraft-1.12.2
          
          # Copy over the specific game directory contents natively
          if [ -d "temp-repo/Web" ]; then
            rsync -av temp-repo/Web/ games/eaglercraft-1.12.2/
          else
            echo "::error::Source folder 'Web' not found!"
            exit 1
          fi

      - name: Remove Base Line in Index (Case Insensitive)
        run: |
          INDEX_FILES=$(find games/eaglercraft-1.12.2 -iname "index.html")
          
          if [ -n "$INDEX_FILES" ]; then
            for file in $INDEX_FILES; do
              echo "Processing base href removal for: $file"
              sed -i '/<base href=/Id' "$file"
            done
            echo "Successfully completed base href sanitization."
          else
            echo "::error::No index.html file found anywhere in games/eaglercraft-1.12.2!"
            exit 1
          fi

      - name: Clean Up Temporary Workspace
        run: |
          rm -rf temp-repo

      - name: Commit and push changes safely to main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage and commit the new game assets
          git add games/eaglercraft-1.12.2/
          git commit -m "Imported Eaglercraft-1.12.2 web assets directly via standard web sync" || echo "No changes to commit"
          
          git pull --rebase origin main
          git push origin main
