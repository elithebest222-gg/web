name: Copy FNAF Into The Pit Port
on:
  workflow_dispatch:

jobs:
  copy-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Explicitly ensures push access permission
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone FNAF Into The Pit source repository
        run: |
          # Clones the web-ports/fnaf-into-the-pit repository with minimal history
          git clone --depth 1 https://github.com/web-ports/fnaf-into-the-pit temp-repo

      - name: Move Assets to Target Location
        run: |
          # Setup destination root structure
          mkdir -p games/fnaf-pit
          
          # Copy over everything except git config metadata
          if [ -d "temp-repo" ]; then
            rsync -av --exclude='.git' temp-repo/ games/fnaf-pit/
          else
            echo "::error::Source repository folder temp-repo not found!"
            exit 1
          fi

      - name: Remove Base Line in Index (Case Insensitive)
        run: |
          INDEX_FILES=$(find games/fnaf-pit -iname "index.html")
          
          if [ -n "$INDEX_FILES" ]; then
            for file in $INDEX_FILES; do
              echo "Processing base href removal for: $file"
              sed -i '/<base href=/Id' "$file"
            done
            echo "Successfully completed base href sanitization."
          else
            echo "::error::No index.html file found anywhere in games/fnaf-pit!"
            exit 1
          fi

      - name: Clean Up Temporary Workspace
        run: |
          rm -rf temp-repo

      - name: Commit and push changes safely to main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage and commit the new game assets
          git add games/fnaf-pit/
          git commit -m "Imported FNAF Into The Pit web assets directly via standard web sync" || echo "No changes to commit"
          
          git pull --rebase origin main
          git push origin main
