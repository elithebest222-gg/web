name: Copy Dead Plate Port
on:
  workflow_dispatch:

# Prevents collision with other deployment or push workflows
concurrency:
  group: dead-plate-import
  cancel-in-progress: false

# GRANTS WRITE PERMISSION TO THE GITHUB_TOKEN
permissions:
  contents: write

jobs:
  copy-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone Dead Plate source repository
        run: |
          # Clones the web-port repository main branch
          git clone --depth 1 https://github.com/elithebest222-gg/web-port/ temp-repo

      - name: Move Assets to Target Location
        run: |
          # Create explicit subfolder layout
          mkdir -p games/dead-plate
          
          if [ -d "temp-repo/dead-plate" ]; then
            # Syncs folders and game framework files from the requested source path
            rsync -av --delete \
              --exclude='.git' \
              --exclude='README.md' \
              --exclude='LICENSE' \
              temp-repo/dead-plate/ games/dead-plate/
          else
            echo "::error::Source repository folder temp-repo/dead-plate not found!"
            exit 1
          fi

      - name: Remove Base Line in Index (Case Insensitive)
        run: |
          # Safe processing execution path for index/loader html patterns
          find games/dead-plate -type f \( -name "*.html" -o -name "*.HTML" \) -exec sh -c '
            for file; do
              echo "Processing base href removal for: $file"
              sed -i "/<base href=/Id" "$file"
            done
          ' _ {} +
          
          echo "Successfully completed base href sanitization."

      - name: Clean Up Temporary Workspace
        if: always()
        run: |
          rm -rf temp-repo

      - name: Commit and push changes safely to main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add games/dead-plate/
          if ! git diff --cached --quiet; then
            git commit -m "Imported Dead Plate web assets directly via web-port source sync"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes detected. Skipping commit."
          fi
